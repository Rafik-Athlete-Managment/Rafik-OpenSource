name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npm run security:check
      - run: npm run test:tooling-security
      - run: npm run test:frontend-inventory
      - run: npm run frontend:inventory:check
      - run: npm test --workspace @rafik/frontend
      - run: npm run build --workspace @rafik/frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run backend:start
      - run: npm run test:e2e --workspace @rafik/frontend -- --empty-database --project=chromium onboarding.e2e.ts
      - run: npm run backend:stop
        if: always()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: apps/frontend/artifacts/
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --include=optional
      - run: npm run backend:start
      - run: npm run seed:local
      - run: npm run docs:check
      - run: npm run backend:inventory:check
      - run: npm run test:retired-domains
      - run: npm run test:institution-names
      - run: npm run test:institution-api
      - run: npm run backend:test
      - run: npm run start:api > /tmp/rafik-api.log 2>&1 &
      - id: api-ready
        run: curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:55331/health
      - run: npm run content:media
      - run: npm run content:exercise-dataset:check
      - run: npm run content:wger-exercises:check
      - run: npm run content:videos
      - run: npm run test:catalog
      - run: npm run backend:typecheck
      - run: npm run test:api
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:organizations
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:programming
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:operations
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:communication
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:organization-services
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:organization-nutrition
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:organization-assets
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:institution-cleanup
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:organization-injuries
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:organization-feedback
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:organization-sports
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:coaching-team
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:concurrent-plans
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run test:delegated-sessions
        if: ${{ !cancelled() && steps.api-ready.outcome == 'success' }}
      - run: npm run backend:stop
        if: always()
